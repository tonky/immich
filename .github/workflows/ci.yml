name: immich
on:
  push:
    branches:
    - main
    - master
    - perf/ci-modernization
  pull_request:
    branches:
    - main
    - master
    - perf/ci-modernization
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  UV_CACHE_DIR: ${{ vars.ENACT_UV_CACHE_DIR || '/tmp/.cache/uv' }}
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  check-and-lint:
    name: "Stage: Check And Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository (sparse)
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          tools.lock
          helpers
          patches
          packages
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          .pnpmfile.cjs
          tsconfig.json
          turbo.json
          packages/cli
          open-api
          packages/sdk/src
          packages/sdk
          server
          web
          i18n
          machine-learning
          e2e/test-assets
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Submodules
      run: |-
        # shellcheck disable=SC2086 # one word per declared submodule path
        git submodule update --init --depth 1 --recommend-shallow --jobs 4 -- $ENACT_SUBMODULES
      env:
        ENACT_SUBMODULES: e2e/test-assets
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            if [ -f "$BIN_DIR/$b" ]; then
              cp -f "$BIN_DIR/$b" "$HOME/.cargo/bin/" 2>/dev/null || true
              chmod +x "$HOME/.cargo/bin/$b" "$BIN_DIR/$b" 2>/dev/null || true
            fi
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - parallel:
      - name: Restore enact CLI binary cache
        id: enact_cli_cache
        if: hashFiles('bin/enact') == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
          path: ~/.cargo/bin/enact
          restore-keys: ${{ runner.os }}-enact-cli-
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore enve Store (L1 GHA Cache)
        id: nix_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-${{ hashFiles('**/enve.lock') }}
          path: ~/.local/share/enve/store
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-
      - name: Restore Node dependency cache
        id: node_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-check-and-lint-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/pnpm-store
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-check-and-lint-
      - name: Restore Cache [node_build]
        id: cache_node_build
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: node_build-${{ runner.os }}-stage-check-and-lint-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          path: |-
            .turbo
            server/dist
            web/build
            packages/*/dist
            packages/sdk/build
          restore-keys: node_build-${{ runner.os }}-stage-check-and-lint-
      - name: Restore Cache [pinned_tools]
        id: cache_pinned_tools
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: pinned_tools-${{ runner.os }}-stage-check-and-lint-${{ hashFiles('tools.lock') }}
          path: .enact/cache/tools
          restore-keys: pinned_tools-${{ runner.os }}-stage-check-and-lint-
      - name: Restore Cache [python_cache]
        id: cache_python_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: python_cache-${{ runner.os }}-stage-check-and-lint-${{ hashFiles('machine-learning/pyproject.toml') }}
          path: |-
            machine-learning/.pytest_cache
            machine-learning/.ruff_cache
          restore-keys: python_cache-${{ runner.os }}-stage-check-and-lint-
    - name: Pull Dependencies via enve
      run: |-
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          if [ -n "$ENACT_R2_BUCKET" ] && ! enve run $([ -f enve.lock ] && echo --locked) -- true 2>/dev/null; then
            enve cache pull enve.lock --cache "$ENACT_R2_BUCKET" --insecure -j 16
          fi
          enve run $([ -f enve.lock ] && echo --locked) -- true
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Install Project Dependencies
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum pnpm-lock.yaml > "$ENACT_INSTALL_INPUTS"
        for input in package.json pnpm-workspace.yaml enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        PNPM_FLAGS="--config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16"
        $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.enact/pnpm-store" --offline $PNPM_FLAGS ||
          $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.enact/pnpm-store" --prefer-offline $PNPM_FLAGS || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify Pipeline Contracts & Sparse Cones (enact ci-verify)
      run: |-
        ENACT_BIN=""
        if [ -x "bin/enact" ]; then
          ENACT_BIN="bin/enact"
        elif command -v enact >/dev/null 2>&1; then
          ENACT_BIN="enact"
        fi
        if [ -n "$ENACT_BIN" ]; then
          echo "🔬 Running enact ci-verify..."
          $ENACT_BIN ci-verify --pipeline .enact --workflow ci
        fi
    - name: Execute Stage [Check And Lint]
      run: |-
        UPDATED_ARG=""
        if [ "${ENACT_INPUT_ALL:-}" = "true" ]; then
          UPDATED_ARG="--all"
        elif [ -n "${ENACT_INPUT_UPDATED:-}" ]; then
          UPDATED_ARG="--updated $ENACT_INPUT_UPDATED"
        fi
        NO_CACHE_ARG=""
        if [ "${ENACT_FORCE_NO_CACHE:-}" = "true" ]; then
          NO_CACHE_ARG="--no-cache"
        fi
        BASE_ARG=""
        BASE_REF="${ENACT_BASE_REF:-}"
        if [ -n "${ENACT_BASE_SHA:-}" ]; then
          if ! git rev-parse --verify "$ENACT_BASE_SHA" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$ENACT_BASE_SHA" 2>/dev/null || true
          fi
          if git rev-parse --verify "$ENACT_BASE_SHA" >/dev/null 2>&1; then
            BASE_ARG="--base $ENACT_BASE_SHA"
          fi
        fi
        if [ -z "$BASE_ARG" ] && [ -z "$BASE_REF" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "${ENACT_EVENT_BEFORE:-}" ] && [ "${ENACT_EVENT_BEFORE:-}" != "0000000000000000000000000000000000000000" ]; then
              BASE_REF="${ENACT_EVENT_BEFORE:-}"
            else
              BASE_REF="HEAD~1"
            fi
          else
            INTEGRATION_BRANCH="${ENACT_INTEGRATION_BRANCH:-}"
            if [ -n "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "${ENACT_DEFAULT_BRANCH:-master}" ]; then
              if ! git rev-parse --verify "origin/$INTEGRATION_BRANCH" >/dev/null 2>&1; then
                git fetch --no-tags --depth=50 origin "$INTEGRATION_BRANCH" 2>/dev/null || true
              fi
              if git rev-parse --verify "origin/$INTEGRATION_BRANCH" >/dev/null 2>&1; then
                BASE_REF="$INTEGRATION_BRANCH"
              fi
            fi
            if [ -z "$BASE_REF" ]; then
              BASE_REF="${ENACT_DEFAULT_BRANCH:-master}"
            fi
          fi
        fi
        if [ -z "$BASE_ARG" ] && [ -n "$BASE_REF" ]; then
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 && ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            git fetch --no-tags --depth=50 origin "$BASE_REF" 2>/dev/null || true
          fi
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --deepen=100 origin 2>/dev/null || git fetch --unshallow origin 2>/dev/null || true
          fi
          MERGE_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          if [ -z "$MERGE_BASE" ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --deepen=500 origin 2>/dev/null || git fetch --unshallow origin 2>/dev/null || true
            MERGE_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          fi
          if [ -n "$MERGE_BASE" ]; then
            BASE_ARG="--base $MERGE_BASE"
          elif git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_ARG="--base $BASE_REF"
          elif git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            BASE_ARG="--base origin/$BASE_REF"
          fi
        fi
        if [ -z "$BASE_ARG" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_ARG="--base HEAD~1"
          fi
        fi
        enact run --pipeline .enact $BASE_ARG $UPDATED_ARG $NO_CACHE_ARG check-and-lint
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
    - parallel:
      - name: Save Cache [node_build]
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_node_build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_node_build.outputs.cache-primary-key }}
          path: |-
            .turbo
            server/dist
            web/build
            packages/*/dist
            packages/sdk/build
      - name: Save Cache [pinned_tools]
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_pinned_tools.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_pinned_tools.outputs.cache-primary-key }}
          path: .enact/cache/tools
      - name: Save Cache [python_cache]
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_python_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_python_cache.outputs.cache-primary-key }}
          path: |-
            machine-learning/.pytest_cache
            machine-learning/.ruff_cache
      - name: Save Node dependency cache
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.node_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/pnpm-store
            node_modules/.cache
      - name: Save enve Store (L1 GHA Cache)
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.nix_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.nix_l1_cache.outputs.cache-primary-key }}
          path: ~/.local/share/enve/store
    - name: Upload Telemetry for [check-and-lint]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-check-and-lint
        path: |-
          .enact/telemetry.json
          .enact/summary.html
        retention-days: "1"
  detect:
    name: Detect Affected Components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
    - name: Checkout Repository (sparse)
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          tools.lock
          helpers
          patches
          packages
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          .pnpmfile.cjs
          tsconfig.json
          turbo.json
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Restore enact CLI binary cache
      id: enact_cli_cache
      if: hashFiles('bin/enact') == ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
        path: ~/.cargo/bin/enact
        restore-keys: ${{ runner.os }}-enact-cli-
    - name: Restore enact Task CAS Cache
      id: enact-tasks-cache
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
        path: .enact/cache
        restore-keys: ${{ runner.os }}-enact-tasks-
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            if [ -f "$BIN_DIR/$b" ]; then
              cp -f "$BIN_DIR/$b" "$HOME/.cargo/bin/" 2>/dev/null || true
              chmod +x "$HOME/.cargo/bin/$b" "$BIN_DIR/$b" 2>/dev/null || true
            fi
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - name: Compute Affected Component Matrix
      id: diff
      run: |-
        git config --global --add safe.directory "*" 2>/dev/null || true
        if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
          cd "${GITHUB_WORKSPACE}"
        fi
        UPDATED_ARG=""
        if [ "${ENACT_INPUT_ALL:-}" = "true" ]; then
          UPDATED_ARG="--all"
        elif [ -n "${ENACT_INPUT_UPDATED:-}" ]; then
          UPDATED_ARG="--updated $ENACT_INPUT_UPDATED"
        fi
        NO_CACHE_ARG=""
        if [ "${ENACT_FORCE_NO_CACHE:-}" = "true" ]; then
          NO_CACHE_ARG="--no-cache"
        fi
        BASE_ARG=""
        BASE_REF="${ENACT_BASE_REF:-}"
        if [ -n "${ENACT_BASE_SHA:-}" ]; then
          if ! git rev-parse --verify "$ENACT_BASE_SHA" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$ENACT_BASE_SHA" 2>/dev/null || true
          fi
          if git rev-parse --verify "$ENACT_BASE_SHA" >/dev/null 2>&1; then
            BASE_ARG="--base $ENACT_BASE_SHA"
          fi
        fi
        if [ -z "$BASE_ARG" ] && [ -z "$BASE_REF" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "${ENACT_EVENT_BEFORE:-}" ] && [ "${ENACT_EVENT_BEFORE:-}" != "0000000000000000000000000000000000000000" ]; then
              BASE_REF="${ENACT_EVENT_BEFORE:-}"
            else
              BASE_REF="HEAD~1"
            fi
          else
            INTEGRATION_BRANCH="${ENACT_INTEGRATION_BRANCH:-}"
            if [ -n "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "${ENACT_DEFAULT_BRANCH:-master}" ]; then
              if ! git rev-parse --verify "origin/$INTEGRATION_BRANCH" >/dev/null 2>&1; then
                git fetch --no-tags --depth=50 origin "$INTEGRATION_BRANCH" 2>/dev/null || true
              fi
              if git rev-parse --verify "origin/$INTEGRATION_BRANCH" >/dev/null 2>&1; then
                BASE_REF="$INTEGRATION_BRANCH"
              fi
            fi
            if [ -z "$BASE_REF" ]; then
              BASE_REF="${ENACT_DEFAULT_BRANCH:-master}"
            fi
          fi
        fi
        if [ -z "$BASE_ARG" ] && [ -n "$BASE_REF" ]; then
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 && ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            git fetch --no-tags --depth=50 origin "$BASE_REF" 2>/dev/null || true
          fi
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --deepen=100 origin 2>/dev/null || git fetch --unshallow origin 2>/dev/null || true
          fi
          MERGE_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          if [ -z "$MERGE_BASE" ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --deepen=500 origin 2>/dev/null || git fetch --unshallow origin 2>/dev/null || true
            MERGE_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          fi
          if [ -n "$MERGE_BASE" ]; then
            BASE_ARG="--base $MERGE_BASE"
          elif git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_ARG="--base $BASE_REF"
          elif git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            BASE_ARG="--base origin/$BASE_REF"
          fi
        fi
        if [ -z "$BASE_ARG" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_ARG="--base HEAD~1"
          fi
        fi
        MATRIX=$(enact affected --pipeline .enact --workflow ci $BASE_ARG $UPDATED_ARG $NO_CACHE_ARG --format json)
        echo "$MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET }}
  summary:
    name: Telemetry & Summary
    needs:
    - detect
    - check-and-lint
    - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Repository (sparse)
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Restore enact CLI binary cache
      id: enact_cli_cache
      if: hashFiles('bin/enact') == ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
        path: ~/.cargo/bin/enact
        restore-keys: ${{ runner.os }}-enact-cli-
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            if [ -f "$BIN_DIR/$b" ]; then
              cp -f "$BIN_DIR/$b" "$HOME/.cargo/bin/" 2>/dev/null || true
              chmod +x "$HOME/.cargo/bin/$b" "$BIN_DIR/$b" 2>/dev/null || true
            fi
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - name: Download All Component Telemetry
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        path: .enact/telemetry
        pattern: telemetry-*
    - name: Generate Consolidated Telemetry Summary
      continue-on-error: true
      run: enact report --dir .enact/telemetry
    - name: Upload Master Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-workflow-summary
        path: .enact/summary.html
        retention-days: "1"
  test:
    name: Run Tests (${{ matrix.component }})
    needs:
    - detect
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
    - name: Checkout Repository (sparse)
      if: ${{ matrix.sparse_checkout != '' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Repository (full)
      if: ${{ matrix.sparse_checkout == '' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        submodules: "false"
    - name: Checkout Submodules
      if: ${{ matrix.submodules != '' }}
      run: |-
        # shellcheck disable=SC2086 # one word per declared submodule path
        git submodule update --init --depth 1 --recommend-shallow --jobs 4 -- $ENACT_SUBMODULES
      env:
        ENACT_SUBMODULES: ${{ matrix.submodules }}
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.cargo/bin" "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            if [ -f "$BIN_DIR/$b" ]; then
              cp -f "$BIN_DIR/$b" "$HOME/.cargo/bin/" 2>/dev/null || true
              chmod +x "$HOME/.cargo/bin/$b" "$BIN_DIR/$b" 2>/dev/null || true
            fi
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$BIN_DIR:$HOME/.cargo/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - parallel:
      - name: Restore enact CLI binary cache
        id: enact_cli_cache
        if: hashFiles('bin/enact') == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-cli-${{ hashFiles('Cargo.lock', 'crates/**') }}
          path: ~/.cargo/bin/enact
          restore-keys: ${{ runner.os }}-enact-cli-
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: hashFiles('**/pyproject.toml', '**/requirements.txt') != '' && (matrix.technology == '' || contains(matrix.technology, 'python')) && vars.ENACT_UV_CACHE_DIR == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            ${{ env.UV_CACHE_DIR }}
            ~/.cache/uv
            ~/.cache/pip
          restore-keys: ${{ runner.os }}-python-
      - name: Restore Go build cache
        id: go_l1_cache
        if: hashFiles('**/go.mod', '**/go.sum') != '' && (matrix.technology == '' || contains(matrix.technology, 'go'))
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
          restore-keys: ${{ runner.os }}-go-
      - name: Restore Rust target & cargo cache
        id: rust_l1_cache
        if: hashFiles('**/Cargo.toml', '**/Cargo.lock') != '' && (matrix.technology == '' || contains(matrix.technology, 'rust'))
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          restore-keys: ${{ runner.os }}-rust-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: matrix.technology == '' || contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/pnpm-store
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-
      - name: Restore Cache [geodata]
        id: cache_geodata
        if: contains(format(',{0},', matrix.caches), ',geodata,')
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: geodata-geonames-ne-v5.1.2-${{ runner.os }}-${{ github.sha }}
          path: .enact/cache/immich-geodata
          restore-keys: geodata-geonames-ne-v5.1.2-${{ runner.os }}-
      - name: Restore Cache [node_build]
        id: cache_node_build
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: node_build-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          path: |-
            .turbo
            server/dist
            web/build
            packages/*/dist
            packages/sdk/build
          restore-keys: node_build-${{ runner.os }}-${{ matrix.task_id }}-
      - name: Restore Cache [pinned_tools]
        id: cache_pinned_tools
        if: contains(format(',{0},', matrix.caches), ',pinned_tools,')
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: pinned_tools-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('tools.lock') }}
          path: .enact/cache/tools
          restore-keys: pinned_tools-${{ runner.os }}-${{ matrix.task_id }}-
      - name: Restore Cache [python_cache]
        id: cache_python_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: python_cache-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('machine-learning/pyproject.toml') }}
          path: |-
            machine-learning/.pytest_cache
            machine-learning/.ruff_cache
          restore-keys: python_cache-${{ runner.os }}-${{ matrix.task_id }}-
      - name: Restore enve Store (L1 GHA Cache)
        id: nix_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-${{ hashFiles('**/enve.lock') }}
          path: ~/.local/share/enve/store
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-
    - name: Pull Dependencies via enve
      run: |-
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          if [ -n "$ENACT_R2_BUCKET" ] && ! enve run $([ -f enve.lock ] && echo --locked) -- true 2>/dev/null; then
            enve cache pull enve.lock --cache "$ENACT_R2_BUCKET" --insecure -j 16
          fi
          enve run $([ -f enve.lock ] && echo --locked) -- true
        fi
        if [ -n "$ENACT_COMPONENT_DIR" ] && [ "$ENACT_COMPONENT_DIR" != "." ] && [ -f "$ENACT_COMPONENT_DIR/enve.lock" ]; then
          if [ -n "$ENACT_R2_BUCKET" ] && ! (cd "$ENACT_COMPONENT_DIR" && enve run $([ -f enve.lock ] && echo --locked) -- true 2>/dev/null); then
            enve cache pull "$ENACT_COMPONENT_DIR/enve.lock" --cache "$ENACT_R2_BUCKET" --insecure -j 16
          fi
          (cd "$ENACT_COMPONENT_DIR" && enve run $([ -f enve.lock ] && echo --locked) -- true)
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Install Project Dependencies
      if: matrix.technology == '' || contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        FILTER_ARGS="${ENACT_MATRIX_FILTER_ARGS:-}"
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum pnpm-lock.yaml > "$ENACT_INSTALL_INPUTS"
        for input in package.json pnpm-workspace.yaml enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        PNPM_FLAGS="--config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16"
        $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.enact/pnpm-store" --offline $PNPM_FLAGS ||
          $RUN_PREFIX pnpm install $FILTER_ARGS --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.enact/pnpm-store" --prefer-offline $PNPM_FLAGS || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
      env:
        ENACT_MATRIX_FILTER_ARGS: ${{ matrix.filter_args }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Execute Component Task
      run: eval "$ENACT_MATRIX_COMMAND"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_MATRIX_COMMAND: ${{ matrix.command }}
        ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
        ENACT_PREEMPTION_NOTICE_SEC: ${{ matrix.preemption_notice_sec }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
        ENACT_TOPOLOGY: ${{ matrix.topology }}
    - name: Push Updated Dependencies to Cloudflare R2
      if: success()
      continue-on-error: true
      run: |-
        if [ -n "$ENACT_R2_BUCKET" ]; then
          if [ -f "enve.lock" ]; then
            echo "🛰️ Pushing missing/updated closures to Cloudflare R2 from repository root..."
            enve cache push enve.lock --cache "$ENACT_R2_BUCKET" -j 16 || true
          fi
          if [ -n "$ENACT_COMPONENT_DIR" ] && [ "$ENACT_COMPONENT_DIR" != "." ] && [ -f "$ENACT_COMPONENT_DIR/enve.lock" ]; then
            echo "🛰️ Pushing missing/updated closures to Cloudflare R2 from $ENACT_COMPONENT_DIR..."
            (cd "$ENACT_COMPONENT_DIR" && enve cache push enve.lock --cache "$ENACT_R2_BUCKET" -j 16) || true
          fi
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ENACT_R2_ACCESS_KEY_ID || env.ENACT_R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.ENACT_R2_SECRET_ACCESS_KEY || env.ENACT_R2_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_R2_BUCKET: ${{ secrets.ENACT_R2_BUCKET || env.ENACT_R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Upload Execution Telemetry & Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/telemetry.json
          .enact/summary.html
        retention-days: "1"
    - name: Save Python build & venv cache
      if: (!cancelled() && vars.ENACT_UV_CACHE_DIR == '' && (success() || steps.python_install.outcome == 'success') && ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/pyproject.toml', '**/requirements.txt') != '' && (matrix.technology == '' || contains(matrix.technology, 'python')) && vars.ENACT_UV_CACHE_DIR == '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1'))) && steps.python_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
        path: |-
          ${{ env.UV_CACHE_DIR }}
          ~/.cache/uv
          ~/.cache/pip
    - parallel:
      - name: Save Go build cache
        if: ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/go.mod', '**/go.sum') != '' && (matrix.technology == '' || contains(matrix.technology, 'go')) && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.go_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
      - name: Save Rust target & cargo cache
        if: ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/Cargo.toml', '**/Cargo.lock') != '' && (matrix.technology == '' || contains(matrix.technology, 'rust')) && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.rust_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache.outputs.cache-primary-key }}
          path: |-
