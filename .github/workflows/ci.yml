# Generated by enact from .enact; edit the pipeline and run `enact ci generate`.
name: immich
on:
  push:
    branches:
    - main
    - master
    - perf/ci-modernization
  pull_request:
    branches:
    - main
    - master
    - perf/ci-modernization
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      files:
        description: File(s) to plan as changed instead of the git diff, comma-separated (e.g. one test file)
        required: false
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENACT_REMOTE_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
  ENACT_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
  ENVE_CACHE_PUBLIC_KEY: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  ENVE_SUBSTITUTERS: https://pub-30fd937eb7634039b8c49d49bfec91a9.r2.dev,https://cache.nixos.org
  ENVE_TRUSTED_PUBLIC_KEYS: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  build-outputs:
    name: Build Outputs
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds != '{"include":[]}' && needs.detect.outputs.builds != '[]' && needs.detect.outputs.builds != '' }}
    uses: ./.github/workflows/ci-matrix.yml
    with:
      matrix: ${{ needs.detect.outputs.builds }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  build-outputs-2:
    name: Build Outputs
    needs:
    - detect
    - build-outputs
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.builds_2 != '{"include":[]}' && needs.detect.outputs.builds_2 != '[]' && needs.detect.outputs.builds_2 != '' }}
    uses: ./.github/workflows/ci-matrix.yml
    with:
      matrix: ${{ needs.detect.outputs.builds_2 }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  build-outputs-3:
    name: Build Outputs
    needs:
    - detect
    - build-outputs
    - build-outputs-2
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.builds_3 != '{"include":[]}' && needs.detect.outputs.builds_3 != '[]' && needs.detect.outputs.builds_3 != '' }}
    uses: ./.github/workflows/ci-matrix.yml
    with:
      matrix: ${{ needs.detect.outputs.builds_3 }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  build-outputs-4:
    name: Build Outputs
    needs:
    - detect
    - build-outputs
    - build-outputs-2
    - build-outputs-3
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.builds_4 != '{"include":[]}' && needs.detect.outputs.builds_4 != '[]' && needs.detect.outputs.builds_4 != '' }}
    uses: ./.github/workflows/ci-matrix.yml
    with:
      matrix: ${{ needs.detect.outputs.builds_4 }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  check-and-lint:
    name: "Stage: Check And Lint"
    runs-on:
    - self-hosted
    - Linux
    - X64
    - tonky-ci
    - tonky-ci-s
    timeout-minutes: 15
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          .pnpmfile.cjs
          tsconfig.json
          turbo.json
          packages/cli
          packages/sdk
          mobile
          open-api
          native
          i18n
          helpers/mobile-prepare.sh
          packages/plugin-sdk
          packages/sdk/src
          server
          helpers/openapi-drift-runner.sh
          server/src/bin/sync-open-api.ts
          server/src/controllers
          server/src/dtos
          server/src/decorators.ts
          server/src/constants.ts
          server/src/enum.ts
          server/src/utils/misc.ts
          packages/plugin-core
          packages/scripts
          web
          helpers/schema-check-runner.sh
          e2e/test-assets
          e2e
          helpers/playwright-runner.sh
          helpers/prepare-e2e-builds.sh
          packages/e2e-auth-server
          machine-learning
    - name: Checkout Repository (sparse)
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          .pnpmfile.cjs
          tsconfig.json
          turbo.json
          packages/cli
          packages/sdk
          mobile
          open-api
          native
          i18n
          helpers/mobile-prepare.sh
          packages/plugin-sdk
          packages/sdk/src
          server
          helpers/openapi-drift-runner.sh
          server/src/bin/sync-open-api.ts
          server/src/controllers
          server/src/dtos
          server/src/decorators.ts
          server/src/constants.ts
          server/src/enum.ts
          server/src/utils/misc.ts
          packages/plugin-core
          packages/scripts
          web
          helpers/schema-check-runner.sh
          e2e/test-assets
          e2e
          helpers/playwright-runner.sh
          helpers/prepare-e2e-builds.sh
          packages/e2e-auth-server
          machine-learning
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Submodules
      run: |-
        # shellcheck disable=SC2086 # one word per declared submodule path
        git submodule update --init --depth 1 --recommend-shallow --jobs 4 -- $ENACT_SUBMODULES
      env:
        ENACT_SUBMODULES: e2e/test-assets
    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      run: enact ci setup-runner
    - name: Download the Reach Map
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      run: |-
        if [ -n "${GITHUB_HEAD_SHA:-}" ] && [ -z "$(git rev-list -n1 --no-walk --ignore-missing --missing=allow-any "$GITHUB_HEAD_SHA" -- 2>/dev/null)" ]; then
          git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_HEAD_SHA" 2>/dev/null || true
        fi
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
      env:
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Plan Stage [Check And Lint]
      id: stage_plan
      run: |-
        RESOLVED=$(enact ci resolve-base) || exit
        eval "$RESOLVED"
        PLAN_ARGS=()
        for arg in "$@"; do
          case "$arg" in --no-cache | --rerun) ;; *) PLAN_ARGS+=("$arg") ;; esac
        done
        set -- "${PLAN_ARGS[@]}"
        enact plan --pipeline .enact --workflow ci "$@" --stage check-and-lint --github-output "$GITHUB_OUTPUT"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') }}
        ENACT_FORCE_RERUN: ${{ contains(github.event.pull_request.title, '[rerun]') || contains(github.event.pull_request.body, '[rerun]') || contains(github.event.pull_request.labels.*.name, 'rerun') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INPUT_WARM_REACH: ${{ inputs.warm_reach }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ (steps.stage_plan.outputs.stage_needs_node == 'true' && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-check-and-lint-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-check-and-lint-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-
      - name: Restore Cache [python_cache]
        id: cache_python_cache
        if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: python_cache-${{ runner.os }}-stage-check-and-lint-${{ hashFiles('machine-learning/pyproject.toml') }}
          path: |-
            machine-learning/.pytest_cache
            machine-learning/.ruff_cache
          restore-keys: python_cache-${{ runner.os }}-stage-check-and-lint-
      - name: Restore Cache [uv_python]
        id: cache_uv_python
        if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: uv_python-${{ runner.os }}-stage-check-and-lint-${{ hashFiles('enve.lock') }}
          path: .enact/state/cache/uv-python
          restore-keys: uv_python-${{ runner.os }}-stage-check-and-lint-
    - name: Record Restored Package Caches
      if: ${{ (steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - name: Pull Dependencies via enve
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps pull --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && steps.stage_plan.outputs.stage_needs_node == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps install node --manager pnpm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify Pipeline Contracts (enact check --contracts)
      run: |-
        ENACT_BIN=""
        if command -v enact >/dev/null 2>&1; then
          ENACT_BIN="enact"
        elif [ -x "bin/enact" ]; then
          ENACT_BIN="bin/enact"
        fi
        if [ -n "$ENACT_BIN" ]; then
          echo "🔬 Running enact check --contracts..."
          $ENACT_BIN check --contracts --pipeline .enact --workflow ci
        fi
    - name: Execute Stage [Check And Lint]
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: |-
        RESOLVED=$(enact ci resolve-base) || exit
        eval "$RESOLVED"
        enact run --pipeline .enact --workflow ci "$@" --stage check-and-lint
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') }}
        ENACT_FORCE_RERUN: ${{ contains(github.event.pull_request.title, '[rerun]') || contains(github.event.pull_request.body, '[rerun]') || contains(github.event.pull_request.labels.*.name, 'rerun') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INPUT_WARM_REACH: ${{ inputs.warm_reach }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && env.ENACT_SAVE_EVENT == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - parallel:
      - name: Save Cache [python_cache]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true') && steps.cache_python_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_python_cache.outputs.cache-primary-key }}
          path: |-
            machine-learning/.pytest_cache
            machine-learning/.ruff_cache
      - name: Save Cache [uv_python]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true') && steps.cache_uv_python.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_uv_python.outputs.cache-primary-key }}
          path: .enact/state/cache/uv-python
      - name: Save Node dependency cache
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && steps.stage_plan.outputs.stage_needs_node == 'true' && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && steps.node_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
    - name: Upload Telemetry for [check-and-lint]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-check-and-lint
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-stage-check-and-lint
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
  detect:
    name: Detect Affected Components
    runs-on:
    - self-hosted
    - Linux
    - X64
    - tonky-ci
    - tonky-ci-s
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.diff.outputs.builds }}
      builds_2: ${{ steps.diff.outputs.builds_2 }}
      builds_3: ${{ steps.diff.outputs.builds_3 }}
